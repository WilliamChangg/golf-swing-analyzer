[package]
name = "golf-swing-analyzer"
version = "0.1.0"
description = "Local-first golf swing biomechanics analyzer"
authors = ["William Chang"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri builds the app as a library so the same code can be driven by tests and
# by the thin main.rs binary.
name = "golf_swing_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets a WebView load a local file, which Phase 14's
# video element needs and nothing before it did. It is inert without the
# matching `assetProtocol` block in tauri.conf.json, whose scope is empty:
# together they mean the app ships able to read no file at all until
# `commands::choose_clip` admits one a human picked.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Note: no tauri-plugin-shell. The engine subprocess is spawned from Rust with
# std::process, which needs no plugin; the shell plugin exists to let the
# *frontend* spawn processes, which this app deliberately does not allow.
#
# Note: no tauri-plugin-fs either. Video import needs a file *picker*, which the
# dialog plugin provides; the path it returns goes to Rust and then to the
# engine, which does the reading. Granting the WebView filesystem access would
# be a much larger permission than the feature actually calls for.

[features]
# Used by `tauri dev` to enable devtools in debug builds.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
